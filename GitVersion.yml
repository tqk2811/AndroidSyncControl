# GitVersion config -- the version is the tag vM.N.P (full SemVer is required).
# increment: None keeps M.N.P from the latest tag; Directory.Build.targets adds -dev.<n> after it.
# The prefix stays optional because the older tag 1.0.0 has none.
deployment-mode: ManualDeployment
tag-prefix: '[vV]?'
branches:
  master:
    regex: ^master$
    increment: None
    label: ''
  main:
    regex: ^main$
    increment: None
    label: ''
  version-branch:
    regex: .*
    increment: None
    source-branches: []
    label: ''
