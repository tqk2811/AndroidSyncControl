name: Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test AndroidSyncControl.sln -c Debug -p:Platform=x64 --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "dotnet test failed" }
