name: Release

# Each tag vM.N.P on master is one release: CI builds it and creates the GitHub Release of the same
# name with its own zip and notes. To publish:
#   git tag v1.2.3
#   git push origin v1.2.3
# To rerun a release, start this workflow by hand and choose the TAG as the ref, not a branch.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on master
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME is not on master" }
          # A tag checkout is a detached HEAD, where GitVersion finds no base version.
          git checkout -B master $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install git-cliff
        shell: pwsh
        run: |
          $ver = "2.13.1"
          $url = "https://github.com/orhun/git-cliff/releases/download/v$ver/git-cliff-$ver-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP "git-cliff.zip"
          Invoke-WebRequest $url -OutFile $zip
          $dst = Join-Path $env:RUNNER_TEMP "git-cliff"
          Expand-Archive $zip -DestinationPath $dst -Force
          $exe = Get-ChildItem $dst -Recurse -Filter git-cliff.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName

      - name: Build + publish + zip
        shell: pwsh
        run: ./.github/workflows/BuildCI.ps1

      - name: Create or update the Release, upload the zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')

          # The zip name carries the version read from the built assembly.
          $zip = Get-ChildItem ./publish/*.zip | Select-Object -First 1
          if (-not $zip) { throw "No zip produced by BuildCI.ps1" }
          if ($zip.BaseName -notmatch '^AndroidSyncControl-(.+)-net') { throw "Cannot parse version from $($zip.Name)" }
          if ($Matches[1] -ne $version) { throw "Built version $($Matches[1]) does not match tag $tag" }

          # Notes cover only this release: from the previous tag to this one.
          $previous = "$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" --match "[0-9]*.[0-9]*.[0-9]*" "$tag^" 2>$null)".Trim()
          $global:LASTEXITCODE = 0
          $range = if ($previous) { "$previous..$tag" } else { $tag }
          $notes = (@(git-cliff --config cliff-release.toml $range) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0) { throw "git-cliff failed" }
          $notes = $notes -replace '__REPO__', "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)"
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Release $tag" }
          Set-Content -Path RELEASE_NOTES.md -Value $notes -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --notes-file RELEASE_NOTES.md
          } else {
            gh release create $tag --title $tag --notes-file RELEASE_NOTES.md --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not create or update the release" }

          gh release upload $tag $zip.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the zip" }
