# git-cliff config rieng cho GitHub Release notes (sinh boi CI .github/workflows/release.yml).
# Khac cliff.toml (CHANGELOG.md local): KHONG header/footer. Dung voi range '<tag truoc>..<tag>',
# nen notes cua moi Release chi gom commit cua ban do.

[changelog]
header = ""
# Chi liet ke cac loai thay doi nguoi dung quan tam (loc o buoc hien thi).
# Muon them/bot loai: sua danh sach trong `commit.group in [...]` ben duoi.
# Moi muc co link toi commit: dat tren scope, commit khong scope thi dat tren (type).
# '__REPO__' duoc release.yml thay bang $GITHUB_SERVER_URL/$GITHUB_REPOSITORY.
body = """
{% for commit in commits %}\
{% if commit.group in ["feat", "fix", "perf", "revert", "refactor", "chore"] %}\
- {% if commit.scope %}({{ commit.group }}) [**{{ commit.scope }}**](__REPO__/commit/{{ commit.id }}){% else %}[({{ commit.group }})](__REPO__/commit/{{ commit.id }}){% endif %} {{ commit.message | upper_first }}{% if commit.breaking %} [**breaking**]{% endif %}
{% endif %}\
{% endfor %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    { pattern = '  +', replace = " " },
]
commit_parsers = [
    { message = "^feat", group = "feat" },
    { message = "^fix", group = "fix" },
    { message = "^perf", group = "perf" },
    { message = "^refactor", group = "refactor" },
    { message = "^docs", group = "docs" },
    { message = "^test", group = "test" },
    { message = "^build", group = "build" },
    { message = "^ci", group = "ci" },
    { message = "^style", group = "style" },
    { message = "^revert", group = "revert" },
    { message = "^sample", group = "sample" },
    { message = "^chore", group = "chore" },
    { message = ".*", group = "other" },
]
filter_commits = false
tag_pattern = '[vV]?[0-9]+\.[0-9]+\.[0-9]+'
sort_commits = "oldest"
